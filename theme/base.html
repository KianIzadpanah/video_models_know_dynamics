<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="{{REL}}assets/site.css">
<script>
/* Set the theme and the sidebar state before first paint so neither flashes.
   The sidebar state has to be persisted rather than held in memory: this is a
   real multi-page site, so clicking a nav link is a full page load and any
   in-memory "collapsed" flag would be lost on every navigation. */
(function(){
  try{var t=localStorage.getItem('vmkd-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
  var n;
  try{n=localStorage.getItem('vmkd-nav');}catch(e){}
  if(n!=='open'&&n!=='closed')n=window.innerWidth<941?'closed':'open';
  document.documentElement.setAttribute('data-nav',n);
})();
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="burger" type="button" aria-label="Show or hide navigation"
          title="Show or hide navigation (n)" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="crumbs">{{BREADCRUMB}}</div>
  <button class="themebtn" type="button" aria-label="Switch colour theme" title="Switch colour theme">
    <svg viewBox="0 0 20 20" aria-hidden="true" width="16" height="16">
      <path class="sun" d="M10 3.2V1M10 19v-2.2M16.8 10H19M1 10h2.2M14.8 5.2l1.6-1.6M3.6 16.4l1.6-1.6M14.8 14.8l1.6 1.6M3.6 3.6l1.6 1.6"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle class="sun" cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path class="moon" d="M15.5 12.6A6.4 6.4 0 0 1 7.4 4.5a6.4 6.4 0 1 0 8.1 8.1z"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">{{SIDEBAR}}</aside>
  <div class="scrim" hidden></div>

  <main id="main">
    <article class="page">
      <header class="pagehead">{{PAGEHEAD}}</header>
      {{TOOLBAR}}
      <div class="prose">{{CONTENT}}</div>
      {{PAGENAV}}
      <footer class="pagefoot">{{FOOTER}}</footer>
    </article>
  </main>
</div>

<div class="lightbox" hidden>
  <div class="lb-back"></div>
  <figure class="lb-fig">
    <video class="lb-video" loop muted playsinline></video>
    <img class="lb-img" alt="" hidden>
    <div class="lb-bar">
      <button class="lb-play" type="button" aria-label="Play or pause">&#9654;</button>
      <button class="lb-step" data-step="-1" type="button" aria-label="Previous frame">&#8249;</button>
      <button class="lb-step" data-step="1" type="button" aria-label="Next frame">&#8250;</button>
      <input class="lb-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <span class="lb-time">0.00s</span>
      <div class="seg lb-rates">
        <button type="button" data-lbrate="1">1&times;</button>
        <button type="button" data-lbrate="0.5">&frac12;&times;</button>
        <button type="button" data-lbrate="0.25">&frac14;&times;</button>
      </div>
      <button class="lb-close" type="button" aria-label="Close">&times;</button>
    </div>
    <figcaption class="lb-cap"></figcaption>
  </figure>
</div>

<script src="{{REL}}assets/site.js" defer></script>
</body>
</html>
